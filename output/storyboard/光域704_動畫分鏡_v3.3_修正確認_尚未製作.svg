  <text x="88" y="1192" class="ui subtitle">V3.3 待製作修正：END GAME 可從所有非 idle 狀態直回外部待機；前導從 Wall Left 地雷按鈕中心擴散；標題固定顯示在牆面。</text>
  <text x="88" y="1221" class="ui tiny">結算驗收以實體投影後閱讀方向為準；PLAY / CONTINUE / RETURN 維持同步閘門。此版尚未代表程式已完成。</text>
</svg>
